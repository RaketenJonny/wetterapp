<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌦️ Wetter WebApp – Stadt oder PLZ</title>
<style>
  body {
    font-family: 'Inter', sans-serif;
    margin: 0; padding: 20px;
    background: #f5f9ff; color: #111;
    transition: background 0.5s, color 0.5s;
  }
  body.dark { background: #0d1117; color: #eee; }
  #themeToggle { position: fixed; top:10px; right:10px; background:none; border:none; cursor:pointer; font-size:24px; }
  h1 { text-align:center; }
  input { width:90%; max-width:350px; padding:10px; border-radius:8px; border:1px solid #ccc; }
  .forecast { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:30px; }
  .card { background:#ffffffb0; border-radius:10px; padding:10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align:center; }
  body.dark .card { background:#161b22; }

  footer {
    text-align:center;
    margin-top:30px;
    font-size:0.9em;
    opacity:0.7;
    transition: color 0.5s;
  }
  body.dark footer { color:#aaa; }

  /* 📱 Mobile horizontale Scroll-Karte */
  @media (max-width: 768px) {
    .forecast {
      display:flex;
      overflow-x:auto;
      scroll-snap-type:x mandatory;
      -webkit-overflow-scrolling:touch;
      gap:12px;
    }
    .card {
      flex: 0 0 150px;
      scroll-snap-align:center;
    }
  }
</style>
</head>
<body>
<button id="themeToggle">🌙</button>
<h1>🌤️ Wetter WebApp – Stadt oder PLZ</h1>
<div style="text-align:center;">
  <input type="text" id="location" placeholder="Stadt oder PLZ eingeben..." />
</div>
<div id="current"></div>
<div class="forecast" id="forecast"></div>

<footer>
  🌍 Datenquelle: 
  <a href="https://open-meteo.com/" target="_blank">Open-Meteo</a> &amp; 
  <a href="https://www.openstreetmap.org/" target="_blank">OpenStreetMap</a><br>
  © 2025 Deine Wetter-WebApp – Alle Angaben ohne Gewähr.
</footer>

<script>
const locationInput=document.getElementById('location'),
currentDiv=document.getElementById('current'),
forecastDiv=document.getElementById('forecast'),
toggle=document.getElementById('themeToggle');

toggle.onclick=()=>{document.body.classList.toggle('dark');toggle.textContent=document.body.classList.contains('dark')?'☀️':'🌙';};
if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('dark');

locationInput.addEventListener('change',()=>fetchWeather(locationInput.value));

async function fetchWeather(input){
 if(!input)return;
 currentDiv.innerHTML="<p>⏳ Lädt...</p>";
 forecastDiv.innerHTML="";
 try{
  let query='';
  let isPostal=false;
  if(/^[0-9]{4,5}$/.test(input)){
    query=`postalcode=${input}`;
    isPostal=true;
  } else {
    query=`q=${encodeURIComponent(input)}`;
  }

  const geo=await fetch(`https://nominatim.openstreetmap.org/search?${query}&countrycodes=de&format=json&limit=1&addressdetails=1`).then(r=>r.json());
  if(!geo.length)return currentDiv.innerHTML="❌ Ort/PLZ nicht gefunden.";

  const lat=parseFloat(geo[0].lat),lon=parseFloat(geo[0].lon);
  const addr=geo[0].address;
  const cityName = addr.city || addr.town || addr.village || addr.hamlet || addr.suburb || addr.county || "Unbekannt";
  const plz = addr.postcode || input;
  const display = `${cityName} (${plz})`;

  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=auto`;
  const data=await fetch(url).then(r=>r.json());
  const c=data.current;
  currentDiv.innerHTML=`<h2>${display}</h2><p>🌡️ ${c.temperature_2m} °C – ${translateWeather(c.weather_code)}</p><p>💧 Luftfeuchte: ${c.relative_humidity_2m}% – 💨 Wind: ${c.wind_speed_10m} km/h</p>`;
  const d=data.daily;
  forecastDiv.innerHTML=d.time.map((t,i)=>`<div class='card'><h4>${new Date(t).toLocaleDateString('de-DE',{weekday:'short'})}</h4><p>${translateWeather(d.weather_code[i])}</p><p>🌡️ ${d.temperature_2m_max[i]} / ${d.temperature_2m_min[i]}°C</p><p>☔ ${d.precipitation_probability_max[i]}%</p></div>`).join('');
 }catch(e){
   currentDiv.innerHTML="Fehler beim Laden.";
 }
}

function translateWeather(code){
 const map={0:"☀️ Klar",1:"🌤️ Meist klar",2:"⛅ Teilw. bewölkt",3:"☁️ Bewölkt",45:"🌫️ Nebel",48:"🌫️ Nebel mit Reif",51:"🌦️ Leicht. Niesel",53:"🌦️ Mäßig. Niesel",55:"🌧️ Stark. Niesel",61:"🌦️ Leicht. Regen",63:"🌧️ Mäßig. Regen",65:"🌧️ Stark. Regen",71:"🌨️ Leicht. Schnee",73:"🌨️ Mäßig. Schnee",75:"❄️ Stark. Schnee",95:"⛈️ Gewitter",99:"🌩️ Stark. Gewitter"};
 return map[code]||"❔ Unbekannt";
}

setInterval(()=>{if(locationInput.value.trim())fetchWeather(locationInput.value.trim())},600000);
</script>
</body>
</html>
