<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌦️ Wetter WebApp – 7 Tage</title>
<style>
  body {
    font-family: 'Inter', sans-serif;
    margin: 0; padding: 20px;
    background: #f5f9ff; color: #111;
    transition: background 0.5s, color 0.5s;
  }
  body.dark { background: #0d1117; color: #eee; }
  #themeToggle { position: fixed; top:10px; right:10px; background:none; border:none; cursor:pointer; font-size:24px; }
  h1 { text-align:center; }
  input { width:250px; padding:10px; border-radius:8px; border:1px solid #ccc; }
  .forecast { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-top:30px; }
  .card { background:#ffffffb0; border-radius:10px; padding:10px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); text-align:center; }
  body.dark .card { background:#161b22; }
</style>
</head>
<body>
<button id="themeToggle">🌙</button>
<h1>🌤️ Wetter WebApp – 7 Tage</h1>
<div style="text-align:center;">
  <input type="text" id="city" placeholder="Stadt eingeben..." />
</div>
<div id="current"></div>
<div class="forecast" id="forecast"></div>

<script>
const cityInput=document.getElementById('city'),
currentDiv=document.getElementById('current'),
forecastDiv=document.getElementById('forecast'),
toggle=document.getElementById('themeToggle');

let lastLat=51,lastLon=10;

toggle.onclick=()=>{document.body.classList.toggle('dark');toggle.textContent=document.body.classList.contains('dark')?'☀️':'🌙';};
if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('dark');

cityInput.addEventListener('change',()=>fetchWeather(cityInput.value));

async function fetchWeather(city){
 if(!city)return;
 currentDiv.innerHTML="<p>⏳ Lädt...</p>";
 forecastDiv.innerHTML="";
 try{
  const geo=await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(city)}&format=json&limit=1`).then(r=>r.json());
  if(!geo.length)return currentDiv.innerHTML="❌ Stadt nicht gefunden.";
  const lat=parseFloat(geo[0].lat),lon=parseFloat(geo[0].lon);
  lastLat=lat; lastLon=lon;
  const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_probability_max&timezone=auto`;
  const data=await fetch(url).then(r=>r.json());
  const c=data.current;
  currentDiv.innerHTML=`<h2>${city}</h2><p>🌡️ ${c.temperature_2m} °C – ${translateWeather(c.weather_code)}</p><p>💧 Luftfeuchte: ${c.relative_humidity_2m}% – 💨 Wind: ${c.wind_speed_10m} km/h</p>`;
  const d=data.daily;
  forecastDiv.innerHTML=d.time.map((t,i)=>`<div class='card'><h4>${new Date(t).toLocaleDateString('de-DE',{weekday:'short'})}</h4><p>${translateWeather(d.weather_code[i])}</p><p>🌡️ ${d.temperature_2m_max[i]} / ${d.temperature_2m_min[i]}°C</p><p>☔ ${d.precipitation_probability_max[i]}%</p></div>`).join('');
 }catch(e){currentDiv.innerHTML="Fehler beim Laden.";}
}

function translateWeather(code){
 const map={0:"☀️ Klar",1:"🌤️ Meist klar",2:"⛅ Teilw. bewölkt",3:"☁️ Bewölkt",45:"🌫️ Nebel",48:"🌫️ Nebel mit Reif",51:"🌦️ Leicht. Niesel",53:"🌦️ Mäßig. Niesel",55:"🌧️ Stark. Niesel",61:"🌦️ Leicht. Regen",63:"🌧️ Mäßig. Regen",65:"🌧️ Stark. Regen",71:"🌨️ Leicht. Schnee",73:"🌨️ Mäßig. Schnee",75:"❄️ Stark. Schnee",95:"⛈️ Gewitter",99:"🌩️ Stark. Gewitter"};
 return map[code]||"❔ Unbekannt";
}

setInterval(()=>{if(cityInput.value.trim())fetchWeather(cityInput.value.trim())},600000);
</script>
</body>
</html>
